[package]
name = "ticketland-api"
version = "0.2.0"
edition = "2021"
license = "BUSL-1.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.0"
actix-rt = "2.2"
actix-web = "4.0.1"
actix-cors = "0.6.1"
actix-multipart = "0.4.0"
bytes = "1.2.0"
borsh = "0.9.3"
env_logger = "0.9.0"
eyre = "0.6.8"
dotenv = "0.15"
futures-util = "0.3.15"
futures = "0.3.12"
ticketland-core = { git = "https://github.com/ticketland-io/common-rust", version = "0.3.0" }
api-helpers = { git = "https://github.com/ticketland-io/common-rust", version = "0.4.0" }
ticketland-data = { git = "https://github.com/ticketland-io/common-rust", version = "0.2.0" }
ticket-verification = { git = "https://github.com/ticketland-io/common-rust", version = "0.2.0" }
amqp-helpers = { git = "https://github.com/ticketland-io/amqp-helpers", version = "0.4.3", rev = "78c9fcf" }
ticketland-event-handler = { git = "https://github.com/ticketland-io/ticketland-event-handler", version="0.2.0" }
price-feed = { git = "https://github.com/ticketland-io/price-feed", version = "0.1.3" }
ticketland-ai = { git = "https://github.com/ticketland-io/ticketland-ai", version = "0.1.3" }
ticketland-utils= { git = "https://github.com/ticketland-io/common-rust", version = "0.2.3" }
chrono = "0.4.21"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.14.1" }
tokio-util = { version = "0.7.1" }
mime = "0.3.16"
async-stripe = { version = "0.21.0", features = ["runtime-tokio-hyper", "checkout", "connect"] }
rand = "0.8.5"
sui-types = { git = "https://github.com/MystenLabs/sui", rev = "9588990" }
sui-sdk = { git = "https://github.com/MystenLabs/sui", rev = "9588990" }
